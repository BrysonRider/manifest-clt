<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Decks Admin — MANIFEST</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --void: #0a0a0a;
    --panel: #121212;
    --signal: #9d4dff;
    --ink: #eeeeee;
    --ink-dim: #999999;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--ink);
    font-family: "IBM Plex Mono", "Courier New", monospace;
    padding: 40px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--signal);
    margin: 0 0 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
  .meta { color: var(--ink-dim); font-size: 13px; margin: 3px 0; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px; margin-bottom: 12px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--void); color: var(--ink); font-size: 15px;
    font-family: inherit;
  }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 6px;
    background: var(--signal); color: #fff; font-weight: bold; font-size: 14px;
    cursor: pointer; letter-spacing: 0.5px;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--ink); margin-top: 8px; }
  .err { color: #ff6666; font-size: 13px; margin: 0 0 12px; }
  .ok { color: #7ee787; }
  pre { white-space: pre-wrap; background: var(--void); padding: 12px; border-radius: 6px; font-size: 13px; border: 1px solid var(--border); }
  a { color: var(--signal); }
  .hint { color: var(--ink-dim); font-size: 12px; margin-top: -6px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>[ Open Decks Admin ]</h1>
  <div id="app"></div>
</div>

<script>
  const API_BASE = "https://script.google.com/macros/s/AKfycbxTrUKYFL84M5ZVV6mlW6wBal7uvGxxCluOdPjklDMBYaTJ6i0vPJ1u_nwJR7bBeOoSug/exec";
  const app = document.getElementById("app");

  function jsonp(params) {
    return new Promise((resolve, reject) => {
      const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timeout = setTimeout(() => { cleanup(); reject(new Error("Request timed out.")); }, 20000);
      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        script.remove();
      }
      window[cbName] = (data) => { cleanup(); resolve(data); };
      const qs = new URLSearchParams(params);
      qs.set("callback", cbName);
      script.src = API_BASE + "?" + qs.toString();
      script.onerror = () => { cleanup(); reject(new Error("Network error reaching the backend.")); };
      document.body.appendChild(script);
    });
  }

  function getStoredPassword() { return localStorage.getItem("odAdminPw") || ""; }
  function storePassword(pw) { localStorage.setItem("odAdminPw", pw); }

  async function boot() {
    app.innerHTML = '<div class="card"><p class="meta">Loading…</p></div>';
    const pw = getStoredPassword();
    try {
      const res = await jsonp({ password: pw });
      if (res.needsSetup) return renderSetup();
      if (!res.ok && res.error === "Wrong password.") return renderLogin("Wrong password.");
      if (!res.ok) return renderLogin(res.error || null);
      return renderDashboard(res.events, pw);
    } catch (err) {
      app.innerHTML = '<div class="card"><p class="err">' + escapeHtml(err.message) + '</p><button class="secondary" onclick="boot()">Retry</button></div>';
    }
  }

  function renderSetup() {
    app.innerHTML =
      '<div class="card">' +
      '<h2>Set your admin password</h2>' +
      '<p class="meta">This runs once. Pick a password you will use to log in every time after this.</p>' +
      '<label>New password</label>' +
      '<input type="password" id="pw-input" autofocus />' +
      '<button id="pw-submit">Save &amp; Enter</button>' +
      '<div id="pw-err"></div>' +
      '</div>';
    document.getElementById("pw-submit").onclick = async () => {
      const pw = document.getElementById("pw-input").value;
      if (!pw) return;
      setBusy(true);
      try {
        const res = await jsonp({ action: "setpw", new_password: pw });
        if (!res.ok) { showInlineErr(res.error); setBusy(false); return; }
        storePassword(pw);
        boot();
      } catch (err) {
        showInlineErr(err.message);
        setBusy(false);
      }
    };
  }

  function renderLogin(error) {
    app.innerHTML =
      '<div class="card">' +
      '<h2>Log in</h2>' +
      (error ? '<p class="err">' + escapeHtml(error) + '</p>' : '') +
      '<label>Password</label>' +
      '<input type="password" id="pw-input" autofocus />' +
      '<button id="pw-submit">Enter</button>' +
      '</div>';
    document.getElementById("pw-submit").onclick = async () => {
      const pw = document.getElementById("pw-input").value;
      storePassword(pw);
      boot();
    };
    document.getElementById("pw-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("pw-submit").click();
    });
  }

  function renderDashboard(events, pw) {
    if (!events.length) {
      app.innerHTML = '<div class="card"><p class="meta">No open (undrawn) events in the Config sheet right now.</p></div>';
      return;
    }
    app.innerHTML = events.map((ev, i) =>
      '<div class="card">' +
      '<h2>' + escapeHtml(ev.eventName) + '</h2>' +
      '<p class="meta">' + escapeHtml(ev.dateText) + ' · ' + escapeHtml(ev.venue) + '</p>' +
      '<p class="meta">' + ev.signupCount + ' signed up · ' + ev.eligibleCount + ' eligible · ' + ev.maxSlots + ' slots</p>' +
      '<button class="draw-btn" data-idx="' + i + '">Draw Lineup &amp; Generate Flyer</button>' +
      '</div>'
    ).join("");
    events.forEach((ev, i) => {
      document.querySelector('.draw-btn[data-idx="' + i + '"]').onclick = async (e) => {
        e.target.disabled = true;
        e.target.textContent = "Drawing…";
        try {
          const res = await jsonp({ action: "draw", eventId: ev.eventId, password: pw });
          if (!res.ok) { alert(res.error); e.target.disabled = false; e.target.textContent = "Draw Lineup & Generate Flyer"; return; }
          renderResult(ev, res.result);
        } catch (err) {
          alert(err.message);
          e.target.disabled = false;
          e.target.textContent = "Draw Lineup & Generate Flyer";
        }
      };
    });
  }

  function renderResult(ev, result) {
    let html = '<div class="card"><h2>Drawn: ' + escapeHtml(ev.eventName) + '</h2>';
    if (result.alreadyDrawn) {
      html += '<p class="meta">Already drawn.</p>';
    } else if (!result.lineupText) {
      html += '<p class="meta">No eligible signups — nobody was drawn. You were emailed.</p>';
    } else {
      html += '<pre>' + escapeHtml(result.lineupText) + '</pre>' +
        '<p><a href="' + result.flyerUrl + '" target="_blank" rel="noopener">Open the flyer</a></p>' +
        '<p class="meta ok">Also emailed to you.</p>';
    }
    html += '<button class="secondary" onclick="boot()">Back to dashboard</button></div>';
    app.innerHTML = html;
  }

  function showInlineErr(msg) {
    const el = document.getElementById("pw-err");
    if (el) el.innerHTML = '<p class="err">' + escapeHtml(msg) + '</p>';
  }
  function setBusy(busy) {
    const btn = document.getElementById("pw-submit");
    if (btn) btn.disabled = busy;
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  boot();
</script>
</body>
</html>
